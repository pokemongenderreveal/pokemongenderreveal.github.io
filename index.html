<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Gender Reveal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

header {
    background: linear-gradient(135deg, #243b6b, #38598f);
    color: white;
    padding: 55px 20px 45px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: clamp(36px, 7vw, 64px);
    letter-spacing: -2px;
}

header p {
    margin: 12px 0 0;
    font-size: 18px;
    opacity: .9;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px 60px;
}

.stats {
    text-align: center;
    margin-bottom: 25px;
    color: #6b7280;
    font-weight: bold;
}

.controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

#search {
    flex: 1;
    min-width: 230px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

.filter {
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.filter.active {
    background: #263d69;
    color: white;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.10);
    text-align: center;
    transition: transform .2s, box-shadow .2s;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,.15);
}

.card img {
    width: 100%;
    border-radius: 13px;
    display: block;
    min-height: 280px;
    object-fit: contain;
    background: #eef1f5;
}

.card h2 {
    margin: 15px 0 4px;
    font-size: 22px;
}

.card-info {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 14px;
}

.verdict {
    padding: 11px;
    border-radius: 12px;
    font-weight: 900;
    font-size: 20px;
}

.boy {
    background: #dbeeff;
    color: #1261a0;
}

.girl {
    background: #ffe0ed;
    color: #b83268;
}

.spoken {
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: bold;
    margin-top: 12px;
    color: #777;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 500px;
    max-height: 94vh;
    overflow-y: auto;
    border-radius: 25px;
    padding: 28px;
    text-align: center;
    position: relative;
}

.modal-content img {
    width: 75%;
    max-width: 320px;
    border-radius: 15px;
}

.close {
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 32px;
    cursor: pointer;
}

.modal-verdict {
    font-size: 44px;
    font-weight: 900;
    margin: 18px 0 8px;
}

.modal-spoken {
    margin-top: 25px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
}

footer {
    text-align: center;
    color: #777;
    padding: 30px;
    font-size: 13px;
}

@media (max-width: 600px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .card {
        padding: 10px;
    }

    .card h2 {
        font-size: 17px;
    }

    .card img {
        min-height: 180px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Pokémon Gender Reveal</h1>
    <p>Settling the question, one card at a time.</p>
</header>

<main class="container">

    <div id="stats" class="stats"></div>

    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search Pokémon, set, or card number..."
        >

        <button class="filter active" data-filter="all">
            All
        </button>

        <button class="filter" data-filter="boy">
            ♂ Boys
        </button>

        <button class="filter" data-filter="girl">
            ♀ Girls
        </button>

    </div>

    <div id="cardGrid" class="grid"></div>

</main>

<footer>
    Pokémon Gender Reveal · The rulings are final.
</footer>

<div id="modal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">×</span>

        <img id="modalImage">

        <h2 id="modalPokemon"></h2>

        <p id="modalInfo"></p>

        <div id="modalVerdict" class="modal-verdict"></div>

        <p>
            After careful examination of the card artwork,
            this Pokémon has been determined to be:
        </p>

        <div id="modalGender"></div>

        <div class="modal-spoken">
            WE HAVE SPOKEN.
        </div>

    </div>

</div>

=========================================================
POKÉMON GENDER REVEAL DATABASE
=========================================================

Each individual CARD gets its own ruling.

The gender below is generated automatically but stays
the SAME every time the website loads.

To manually change a ruling, use the overrides section.

Example:

const overrides = {
    "me05-116": "girl",
    "me55-154": "boy"
};

=========================================================
*/


const overrides = {

    // Add your permanent rulings here later.

};


/*
=========================================================
HELPER FUNCTIONS
=========================================================
*/

function stableGender(id) {

    if (overrides[id]) {
        return overrides[id];
    }

    let total = 0;

    for (let i = 0; i < id.length; i++) {
        total += id.charCodeAt(i) * (i + 1);
    }

    return total % 2 === 0 ? "boy" : "girl";
}


function makeCard(pokemon, set, setID, number, total) {

    const id = setID + "-" + number;

    return {
        id: id,
        pokemon: pokemon,
        set: set,
        number: String(number).padStart(3, "0") + "/" + total,
        gender: stableGender(id),

        /*
        Same image system as your original working website.
        */
        image:
            "https://images.pokemontcg.io/" +
            setID +
            "/" +
            number +
            "_hires.png"
    };
}

/*
=========================================================
WEBSITE
=========================================================
*/

const grid = document.getElementById("cardGrid");
const search = document.getElementById("search");
const stats = document.getElementById("stats");

let activeFilter = "all";


function renderCards() {

    const searchText =
        search.value.toLowerCase();

    grid.innerHTML = "";

    const filtered = cards.filter(card => {

        const matchesSearch =
            card.pokemon.toLowerCase().includes(searchText) ||
            card.set.toLowerCase().includes(searchText) ||
            card.number.toLowerCase().includes(searchText);

        const matchesGender =
            activeFilter === "all" ||
            card.gender === activeFilter;

        return matchesSearch && matchesGender;

    });


    const boys =
        cards.filter(card => card.gender === "boy").length;

    const girls =
        cards.filter(card => card.gender === "girl").length;


    stats.textContent =
        cards.length +
        " RULINGS · " +
        boys +
        " BOYS · " +
        girls +
        " GIRLS";


    filtered.forEach(card => {

        const cardElement =
            document.createElement("div");

        cardElement.className = "card";

        const symbol =
            card.gender === "boy" ? "♂" : "♀";

        const label =
            card.gender === "boy" ? "BOY" : "GIRL";


        cardElement.innerHTML = `

            <img
                src="${card.image}"
                alt="${card.pokemon} Pokémon card"
                loading="lazy"
                onerror="this.style.opacity='.25'"
            >

            <h2>${card.pokemon}</h2>

            <div class="card-info">
                ${card.set}<br>
                ${card.number}
            </div>

            <div class="verdict ${card.gender}">
                ${symbol} ${label}
            </div>

            <div class="spoken">
                WE HAVE SPOKEN.
            </div>

        `;


        cardElement.onclick =
            () => openModal(card);

        grid.appendChild(cardElement);

    });


    if (filtered.length === 0) {

        grid.innerHTML = `
            <p>No rulings found.</p>
        `;

    }

}


function openModal(card) {

    const modal =
        document.getElementById("modal");

    document.getElementById(
        "modalImage"
    ).src = card.image;

    document.getElementById(
        "modalPokemon"
    ).textContent = card.pokemon;

    document.getElementById(
        "modalInfo"
    ).textContent =
        card.set + " · " + card.number;


    const symbol =
        card.gender === "boy" ? "♂" : "♀";

    const label =
        card.gender === "boy" ? "BOY" : "GIRL";


    const verdict =
        document.getElementById("modalVerdict");

    verdict.textContent =
        symbol + " " + label;

    verdict.className =
        "modal-verdict " + card.gender;


    document.getElementById(
        "modalGender"
    ).textContent =
        "The ruling is " + label + ".";


    modal.style.display = "flex";

}


function closeModal() {

    document.getElementById(
        "modal"
    ).style.display = "none";

}


document.getElementById(
    "modal"
).addEventListener("click", function(event) {

    if (event.target === this) {
        closeModal();
    }

});


search.addEventListener(
    "input",
    renderCards
);

        function() {

            document
            .querySelectorAll(".filter")
            .forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");

            activeFilter =
                this.dataset.filter;

            renderCards();

        }
    );

});
