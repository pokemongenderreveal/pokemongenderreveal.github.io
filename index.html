<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Gender Reveal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6fa;
    color: #20242c;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #172554, #315da8);
    color: white;
    text-align: center;
    padding: 55px 20px 45px;
}

header h1 {
    margin: 0;
    font-size: clamp(38px, 7vw, 68px);
    letter-spacing: -2px;
}

header p {
    margin: 12px 0 0;
    font-size: 18px;
    opacity: .9;
}

/* MAIN */

.container {
    max-width: 1300px;
    margin: auto;
    padding: 35px 20px 70px;
}

.stats {
    text-align: center;
    margin-bottom: 25px;
    color: #6b7280;
    font-weight: bold;
}

/* CONTROLS */

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 30px;
}

#search {
    flex: 1;
    min-width: 250px;
    padding: 15px 17px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 16px;
}

button {
    font-family: inherit;
}

.filter,
.randomButton {
    border: 0;
    padding: 13px 17px;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.filter.active {
    background: #263d69;
    color: white;
}

.randomButton {
    background: #ffcb05;
    color: #222;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 80px 20px;
}

.loadingBall {
    font-size: 50px;
    animation: bounce .8s infinite alternate;
}

@keyframes bounce {
    to {
        transform: translateY(-15px);
    }
}

/* GRID */

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,.09);
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,.15);
}

.imageWrap {
    aspect-ratio: 0.716;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eceff3;
    border-radius: 13px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.card h2 {
    font-size: 20px;
    margin: 14px 0 4px;
}

.cardNumber {
    font-size: 13px;
    color: #777;
    margin-bottom: 12px;
}

/* VERDICTS */

.verdict {
    border-radius: 11px;
    padding: 10px;
    font-size: 19px;
    font-weight: 900;
}

.boy {
    background: #dbeeff;
    color: #1261a0;
}

.girl {
    background: #ffe0ed;
    color: #b83268;
}

.spoken {
    margin-top: 11px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #777;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0,0,0,.82);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modalContent {
    width: 100%;
    max-width: 520px;
    max-height: 95vh;
    overflow-y: auto;
    background: white;
    border-radius: 26px;
    text-align: center;
    padding: 30px;
    position: relative;
}

.close {
    position: absolute;
    right: 18px;
    top: 10px;
    font-size: 35px;
    cursor: pointer;
    z-index: 3;
}

#modalImage {
    width: 72%;
    max-width: 320px;
    border-radius: 15px;
}

#modalName {
    margin-bottom: 5px;
}

#modalNumber {
    color: #777;
}

.modalVerdict {
    margin: 20px 0;
    padding: 16px;
    border-radius: 15px;
    font-size: 40px;
    font-weight: 900;
}

.finalWords {
    margin-top: 27px;
    padding-top: 22px;
    border-top: 2px solid #eee;
    font-size: 24px;
    font-weight: 1000;
    letter-spacing: 3px;
}

/* ERROR */

.error {
    text-align: center;
    background: #fff;
    border-radius: 20px;
    padding: 35px;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    color: #777;
    padding: 35px 20px;
    font-size: 13px;
}

@media (max-width: 600px) {

    .container {
        padding-left: 12px;
        padding-right: 12px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .card {
        padding: 9px;
    }

    .card h2 {
        font-size: 16px;
    }

    .verdict {
        font-size: 16px;
    }

    .controls button {
        flex-grow: 1;
    }
}

</style>
</head>

<body>

<header>

    <h1>Pokémon Gender Reveal</h1>

    <p>
        Settling the question, one card at a time.
    </p>

</header>


<main class="container">

    <div id="stats" class="stats">
        Preparing the rulings...
    </div>


    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search Pokémon or card number..."
        >

        <button
            class="filter active"
            data-filter="all"
        >
            All
        </button>

        <button
            class="filter"
            data-filter="boy"
        >
            ♂ Boys
        </button>

        <button
            class="filter"
            data-filter="girl"
        >
            ♀ Girls
        </button>

        <button
            class="randomButton"
            onclick="randomRuling()"
        >
            🎲 Random Ruling
        </button>

    </div>


    <div id="loading" class="loading">

        <div class="loadingBall">
            ◉
        </div>

        <h2>Consulting the council...</h2>

        <p>
            Gathering Pokémon cards.
        </p>

    </div>


    <div
        id="cardGrid"
        class="grid"
        style="display:none;"
    ></div>

</main>


<footer>
    Pokémon Gender Reveal · WE HAVE SPOKEN.
</footer>


<div id="modal" class="modal">

    <div class="modalContent">

        <span
            class="close"
            onclick="closeModal()"
        >
            ×
        </span>

        <img id="modalImage">

        <h1 id="modalName"></h1>

        <div id="modalNumber"></div>

        <div
            id="modalVerdict"
            class="modalVerdict"
        ></div>

        <p>
            After careful examination of the
            card artwork, the ruling has been made.
        </p>

        <div class="finalWords">
            WE HAVE SPOKEN.
        </div>

    </div>

</div>


<script>

/*
========================================================

        POKÉMON GENDER REVEAL DATABASE

The site automatically downloads card information.

Your permanent rulings can eventually be entered
in the OVERRIDES section below.

========================================================
*/


/*
========================================================
YOUR RULINGS

Later, you'll put cards you've personally ruled on here.

Example:

const overrides = {

    "sv3pt5-173": "boy",
    "sv3pt5-168": "girl"

};

The card ID is unique, so TWO different Pikachu cards
can have completely different rulings.

========================================================
*/


const overrides = {

    "sv3pt5-166": "girl"
    
};


/*
========================================================
SETTINGS
========================================================
*/

const CARD_LIMIT = 700;


/*
We're using several sets so the gallery contains
different eras and different Pokémon.
*/

const setsToLoad = [

    "sv3pt5",   // 151
    "sv4",      // Paradox Rift
    "sv5",      // Temporal Forces
    "sv6",      // Twilight Masquerade
    "sv7"       // Stellar Crown
    "me05"      // Pitch Black

];


let allCards = [];

let visibleCards = [];

let currentFilter = "all";


/*
========================================================
FIXED PLACEHOLDER GENDER

This does NOT randomly change on refresh.

The card's unique ID is converted into a number.
That number always produces the same placeholder result.

Once YOU make a ruling, an override replaces it.
========================================================
*/


function getGender(card) {

    if (overrides[card.id]) {

        return overrides[card.id];

    }

    let number = 0;

    for (let i = 0; i < card.id.length; i++) {

        number +=
            card.id.charCodeAt(i) * (i + 1);

    }

    return number % 2 === 0
        ? "boy"
        : "girl";

}


/*
========================================================
LOAD CARDS
========================================================
*/


async function loadCards() {

    try {

        let collected = [];


        for (const setID of setsToLoad) {

            if (collected.length >= CARD_LIMIT) {
                break;
            }


            const response = await fetch(
                "https://api.tcgdex.net/v2/en/sets/" + setID
            );


            if (!response.ok) {
                continue;
            }


            const setData =
                await response.json();


            if (!setData.cards) {
                continue;
            }


            for (const card of setData.cards) {

                if (collected.length >= CARD_LIMIT) {
                    break;
                }


                /*
                Skip cards without an image.
                */

                if (!card.image) {
                    continue;
                }


                collected.push({

                    id: card.id,

                    name: card.name,

                    localId:
                        card.localId || "?",

                    setName:
                        setData.name || setID,

                    /*
                    TCGdex image URLs can request
                    high-resolution PNG images.
                    */

                    image:
                        card.image + "/high.png"

                });

            }

        }


        /*
        Remove duplicate IDs just in case.
        */

        const uniqueCards =
            Array.from(
                new Map(
                    collected.map(card =>
                        [card.id, card]
                    )
                ).values()
            );


        allCards =
            uniqueCards.slice(0, CARD_LIMIT);


        /*
        Add gender rulings.
        */

        allCards =
            allCards.map(card => ({

                ...card,

                gender:
                    getGender(card)

            }));


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "cardGrid"
        ).style.display = "grid";


        renderCards();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "loading"
        ).innerHTML = `

            <h2>The council encountered a problem.</h2>

            <p>
                The card database could not be loaded.
                Try refreshing the page.
            </p>

        `;

    }

}


/*
========================================================
DISPLAY CARDS
========================================================
*/


function renderCards() {

    const searchText =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    visibleCards =
        allCards.filter(card => {


            const searchable =
                (
                    card.name +
                    " " +
                    card.setName +
                    " " +
                    card.localId
                )
                .toLowerCase();


            const searchMatch =
                searchable.includes(searchText);


            const genderMatch =
                currentFilter === "all" ||
                card.gender === currentFilter;


            return searchMatch && genderMatch;

        });


    const grid =
        document.getElementById("cardGrid");


    grid.innerHTML = "";


    visibleCards.forEach(card => {

        const element =
            document.createElement("div");


        element.className = "card";


        const isBoy =
            card.gender === "boy";


        const symbol =
            isBoy ? "♂" : "♀";


        const label =
            isBoy ? "BOY" : "GIRL";


        element.innerHTML = `

            <div class="imageWrap">

                <img
                    src="${card.image}"
                    alt="${escapeHTML(card.name)} Pokémon card"
                    loading="lazy"
                    onerror="this.parentElement.innerHTML='Card image unavailable';"
                >

            </div>

            <h2>
                ${escapeHTML(card.name)}
            </h2>

            <div class="cardNumber">

                ${escapeHTML(card.setName)}
                <br>

                Card ${escapeHTML(card.localId)}

            </div>

            <div
                class="verdict ${card.gender}"
            >

                ${symbol} ${label}

            </div>

            <div class="spoken">

                WE HAVE SPOKEN.

            </div>

        `;


        element.addEventListener(
            "click",
            () => openModal(card)
        );


        grid.appendChild(element);

    });


    /*
    Statistics
    */

    const boys =
        allCards.filter(
            card => card.gender === "boy"
        ).length;


    const girls =
        allCards.filter(
            card => card.gender === "girl"
        ).length;


    document.getElementById(
        "stats"
    ).textContent =

        allCards.length +
        " rulings · " +
        boys +
        " boys · " +
        girls +
        " girls";


    if (visibleCards.length === 0) {

        grid.innerHTML = `

            <div class="error">

                <h2>No rulings found.</h2>

                <p>
                    Try another search.
                </p>

            </div>

        `;

    }

}


/*
========================================================
CARD POPUP
========================================================
*/


function openModal(card) {

    document.getElementById(
        "modalImage"
    ).src = card.image;


    document.getElementById(
        "modalName"
    ).textContent = card.name;


    document.getElementById(
        "modalNumber"
    ).textContent =

        card.setName +
        " · Card " +
        card.localId;


    const verdict =
        document.getElementById(
            "modalVerdict"
        );


    if (card.gender === "boy") {

        verdict.textContent =
            "♂ BOY";

        verdict.className =
            "modalVerdict boy";

    }

    else {

        verdict.textContent =
            "♀ GIRL";

        verdict.className =
            "modalVerdict girl";

    }


    document.getElementById(
        "modal"
    ).style.display = "flex";


    document.body.style.overflow =
        "hidden";

}


function closeModal() {

    document.getElementById(
        "modal"
    ).style.display = "none";


    document.body.style.overflow =
        "";

}


/*
Close when clicking outside the popup.
*/


document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event) {

        if (event.target === this) {

            closeModal();

        }

    }
);


/*
Escape key closes popup.
*/


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeModal();

        }

    }
);


/*
========================================================
SEARCH
========================================================
*/


document.getElementById(
    "search"
).addEventListener(
    "input",
    renderCards
);


/*
========================================================
FILTER BUTTONS
========================================================
*/


document
.querySelectorAll(".filter")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {


            document
            .querySelectorAll(".filter")
            .forEach(btn =>
                btn.classList.remove("active")
            );


            this.classList.add("active");


            currentFilter =
                this.dataset.filter;


            renderCards();

        }
    );

});


/*
========================================================
RANDOM RULING
========================================================
*/


function randomRuling() {

    if (allCards.length === 0) {
        return;
    }


    const randomCard =
        allCards[
            Math.floor(
                Math.random() *
                allCards.length
            )
        ];


    openModal(randomCard);

}


/*
========================================================
BASIC HTML SAFETY
========================================================
*/


function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/*
========================================================
START WEBSITE
========================================================
*/


loadCards();

</script>

</body>
</html>
