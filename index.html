<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Gender Reveal</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f5f9;
        color: #20242d;
    }

    /* =========================
       HEADER
       ========================= */

    header {
        background: linear-gradient(135deg, #182f63, #3866ad);
        color: white;
        text-align: center;
        padding: 48px 20px 55px;
    }

    header h1 {
        margin: 0;
        font-size: clamp(42px, 6vw, 78px);
        font-weight: 800;
        letter-spacing: -2px;
    }

    header p {
        margin: 16px 0 0;
        font-size: 21px;
    }

    /* =========================
       MAIN
       ========================= */

    main {
        width: min(1500px, 92%);
        margin: 0 auto;
        padding: 38px 0 80px;
    }

    #stats {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #687080;
        margin-bottom: 28px;
    }

    /* =========================
       CONTROLS
       ========================= */

    .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 34px;
        flex-wrap: wrap;
    }

    #searchInput {
        flex: 1;
        min-width: 280px;
        height: 58px;
        border: 1px solid #cfd4de;
        border-radius: 14px;
        padding: 0 20px;
        font-size: 18px;
        background: white;
        outline: none;
    }

    #searchInput:focus {
        border-color: #315a9e;
        box-shadow: 0 0 0 3px rgba(49, 90, 158, 0.12);
    }

    button {
        height: 58px;
        padding: 0 23px;
        border: 0;
        border-radius: 14px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        background: white;
        color: #20242d;
        box-shadow: 0 4px 13px rgba(0,0,0,0.06);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 16px rgba(0,0,0,0.10);
    }

    .filter.active {
        background: #284c84;
        color: white;
    }

    #randomButton {
        background: #ffca05;
        color: #171717;
    }

    /* =========================
       STATUS / ERRORS
       ========================= */

    #statusBox {
        background: white;
        border-radius: 20px;
        padding: 38px 20px;
        text-align: center;
        margin-bottom: 25px;
    }

    #statusTitle {
        font-size: 27px;
        font-weight: 800;
        margin-bottom: 10px;
    }

    #statusText {
        color: #687080;
        font-size: 17px;
        line-height: 1.5;
    }

    #setStatus {
        margin-top: 14px;
        font-size: 14px;
        color: #8a909b;
    }

    /* =========================
       CARD GRID
       ========================= */

    #cardGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 25px;
    }

    .card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 7px 22px rgba(0,0,0,0.08);
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 13px 28px rgba(0,0,0,0.13);
    }

    .imageWrap {
        background: #e9edf3;
        aspect-ratio: 245 / 337;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .imageWrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    .cardBody {
        padding: 17px 17px 20px;
    }

    .pokemonName {
        font-size: 21px;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .cardInfo {
        color: #727986;
        font-size: 14px;
        line-height: 1.45;
        margin-bottom: 14px;
        word-break: break-word;
    }

    .gender {
        display: inline-block;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 14px;
        font-weight: 800;
    }

    .gender.boy {
        background: #dceaff;
        color: #1d5db7;
    }

    .gender.girl {
        background: #ffe0ec;
        color: #b62e68;
    }

    .spoken {
        margin-top: 12px;
        font-size: 11px;
        letter-spacing: 1.4px;
        font-weight: 900;
        color: #9a9fa8;
    }

    /* =========================
       EMPTY RESULTS
       ========================= */

    #emptyBox {
        display: none;
        background: white;
        border-radius: 22px;
        padding: 60px 20px;
        text-align: center;
    }

    #emptyBox h2 {
        margin: 0 0 14px;
        font-size: 28px;
    }

    #emptyBox p {
        margin: 0;
        font-size: 18px;
    }

    /* =========================
       MODAL
       ========================= */

    #modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 16, 28, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 1000;
    }

    #modal.open {
        display: flex;
    }

    .modalContent {
        width: min(900px, 96vw);
        max-height: 94vh;
        overflow: auto;
        background: white;
        border-radius: 24px;
        position: relative;
        padding: 28px;
    }

    #closeModal {
        position: absolute;
        right: 17px;
        top: 15px;
        width: 43px;
        height: 43px;
        padding: 0;
        border-radius: 50%;
        background: #eef0f4;
        font-size: 23px;
        box-shadow: none;
        z-index: 2;
    }

    .modalLayout {
        display: grid;
        grid-template-columns: minmax(250px, 380px) 1fr;
        gap: 32px;
        align-items: center;
    }

    #modalImage {
        width: 100%;
        display: block;
    }

    #modalName {
        margin: 0 0 10px;
        font-size: 36px;
    }

    #modalInfo {
        color: #6d7480;
        line-height: 1.6;
        margin-bottom: 20px;
        word-break: break-word;
    }

    #modalGender {
        display: inline-block;
        border-radius: 999px;
        padding: 10px 17px;
        font-size: 20px;
        font-weight: 900;
    }

    #modalSpoken {
        margin-top: 23px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.7px;
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
        text-align: center;
        color: #777d87;
        padding: 25px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {
        header {
            padding: 36px 16px 40px;
        }

        header p {
            font-size: 17px;
        }

        main {
            width: 94%;
            padding-top: 27px;
        }

        .controls {
            gap: 8px;
        }

        #searchInput {
            width: 100%;
            flex-basis: 100%;
        }

        button {
            flex: 1;
            padding: 0 13px;
            font-size: 15px;
        }

        #randomButton {
            flex-basis: 100%;
        }

        #cardGrid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .cardBody {
            padding: 12px;
        }

        .pokemonName {
            font-size: 17px;
        }

        .cardInfo {
            font-size: 12px;
        }

        .modalLayout {
            grid-template-columns: 1fr;
        }

        #modalImage {
            max-width: 340px;
            margin: 0 auto;
        }

        #modalName {
            font-size: 30px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Pokémon Gender Reveal</h1>
    <p>Settling the question, one card at a time.</p>
</header>

<main>

    <div id="stats">
        0 rulings · 0 boys · 0 girls
    </div>

    <div class="controls">

        <input
            id="searchInput"
            type="text"
            placeholder="Search Pokémon, set, card number, or ID..."
        >

        <button class="filter active" data-filter="all">
            All
        </button>

        <button class="filter" data-filter="boy">
            ♂ Boys
        </button>

        <button class="filter" data-filter="girl">
            ♀ Girls
        </button>

        <button id="randomButton">
            🎲 Random Ruling
        </button>

    </div>

    <div id="statusBox">
        <div id="statusTitle">Consulting the council...</div>

        <div id="statusText">
            Loading Pokémon cards.
        </div>

        <div id="setStatus"></div>
    </div>

    <div id="cardGrid"></div>

    <div id="emptyBox">
        <h2>No rulings found.</h2>
        <p>Try another search.</p>
    </div>

</main>

<footer>
    Pokémon Gender Reveal · WE HAVE SPOKEN.
</footer>


<!-- =========================
     CARD MODAL
     ========================= -->

<div id="modal">

    <div class="modalContent">

        <button id="closeModal">×</button>

        <div class="modalLayout">

            <div>
                <img id="modalImage" alt="">
            </div>

            <div>
                <h2 id="modalName"></h2>

                <div id="modalInfo"></div>

                <div id="modalGender"></div>

                <div id="modalSpoken">
                    WE HAVE SPOKEN.
                </div>
            </div>

        </div>

    </div>

</div>


<script>

/* ============================================================
   POKÉMON GENDER REVEAL
   ============================================================

   IMPORTANT:

   You normally only need to edit TWO sections:

   1. SET_NAMES
      Controls which sets appear on the website.

   2. overrides
      Controls your official boy/girl rulings.

   Everything else can stay alone.
   ============================================================ */


/* ============================================================
   1. SETS TO LOAD
   ============================================================

   We use SET NAMES rather than IDs.

   The website asks TCGdex for its current set list and finds
   the correct ID automatically.

   If a set name is not found, the rest of the website will
   STILL work.
   ============================================================ */

const SET_NAMES = [

    "151",

    "Paradox Rift",

    "Temporal Forces",

    "Twilight Masquerade",

    "Pitch Black"


];


/* ============================================================
   2. YOUR OFFICIAL RULINGS
   ============================================================

   THIS IS WHERE YOU CHANGE GENDERS.

   Format:

   "card-id": "boy",
   "card-id": "girl"

   Example:

   const overrides = {
       "sv03.5-166": "boy",
       "sv04-208": "girl"
   };

   IMPORTANT:
   Use the EXACT Card ID displayed on the website.

   Every card now displays its ID underneath the card number.
   ============================================================ */

const overrides = {

    "sv03.5-002": "girl",
    "sv03.5-007": "girl",
    "sv03.5-011": "boy",
    "sv03.5-013": "boy",
    "sv03.5-016": "boy",
    "sv03.5-017": "boy",
    "sv03.5-023": "girl"

};


/* ============================================================
   SETTINGS
   ============================================================ */

/*
   Set this to a number if you want to limit the database.

   Example:
   const CARD_LIMIT = 200;

   Leave it as null to show every card from the selected sets.
*/

const CARD_LIMIT = null;


/* ============================================================
   API
   ============================================================ */

const API_BASE = "https://api.tcgdex.net/v2/en";


/* ============================================================
   APP STATE
   ============================================================ */

let allCards = [];

let currentFilter = "all";

let searchTerm = "";


/* ============================================================
   HTML ELEMENTS
   ============================================================ */

const grid = document.getElementById("cardGrid");

const stats = document.getElementById("stats");

const searchInput = document.getElementById("searchInput");

const filterButtons = document.querySelectorAll(".filter");

const randomButton = document.getElementById("randomButton");

const statusBox = document.getElementById("statusBox");

const statusTitle = document.getElementById("statusTitle");

const statusText = document.getElementById("statusText");

const setStatus = document.getElementById("setStatus");

const emptyBox = document.getElementById("emptyBox");

const modal = document.getElementById("modal");

const closeModalButton = document.getElementById("closeModal");

const modalImage = document.getElementById("modalImage");

const modalName = document.getElementById("modalName");

const modalInfo = document.getElementById("modalInfo");

const modalGender = document.getElementById("modalGender");


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================================================
   NORMALIZE TEXT
   ============================================================ */

function normalize(value) {

    return String(value ?? "")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, "");

}


/* ============================================================
   DETERMINE GENDER
   ============================================================

   FIRST:
   Check whether YOU have manually ruled on the card.

   SECOND:
   If you have not ruled yet, give the card a stable placeholder
   ruling based on its ID.

   This placeholder DOES NOT change every refresh.

   Once you put the card in "overrides", your ruling always wins.
   ============================================================ */

function getGender(cardID) {

    if (overrides[cardID] === "boy") {
        return "boy";
    }

    if (overrides[cardID] === "girl") {
        return "girl";
    }

    let number = 0;

    for (let i = 0; i < cardID.length; i++) {

        number += cardID.charCodeAt(i) * (i + 1);

    }

    return number % 2 === 0 ? "boy" : "girl";

}


/* ============================================================
   IMAGE URL
   ============================================================ */

function getImageURL(base, quality = "low") {

    if (!base) {
        return "";
    }

    return `${base}/${quality}.webp`;

}


/* ============================================================
   LOAD A JSON URL
   ============================================================ */

async function getJSON(url) {

    const response = await fetch(url, {
        headers: {
            "Accept": "application/json"
        }
    });

    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status} while loading ${url}`
        );

    }

    return await response.json();

}


/* ============================================================
   FIND A SET BY NAME
   ============================================================ */

function findSet(setList, requestedName) {

    const requested = normalize(requestedName);

    /*
       First try an EXACT normalized match.
    */

    let match = setList.find(set => {

        return normalize(set.name) === requested;

    });

    if (match) {
        return match;
    }

    /*
       Then try a partial match.

       This helps if the API uses something like:
       "Scarlet & Violet—151"
       instead of simply:
       "151"
    */

    match = setList.find(set => {

        const apiName = normalize(set.name);

        return (
            apiName.includes(requested) ||
            requested.includes(apiName)
        );

    });

    return match || null;

}


/* ============================================================
   LOAD ALL CARDS
   ============================================================ */

async function loadCards() {

    statusBox.style.display = "block";

    statusTitle.textContent = "Consulting the council...";

    statusText.textContent =
        "Finding the correct Pokémon TCG sets.";

    setStatus.textContent = "";

    const collected = [];

    const loadedSets = [];

    const failedSets = [];

    try {

        /*
           STEP 1:
           Download the CURRENT TCGdex set list.
        */

        const setList = await getJSON(
            `${API_BASE}/sets`
        );


        if (!Array.isArray(setList)) {

            throw new Error(
                "TCGdex returned an unexpected set list."
            );

        }


        /*
           STEP 2:
           Find each requested set by NAME.
        */

        for (const requestedName of SET_NAMES) {

            if (
                CARD_LIMIT !== null &&
                collected.length >= CARD_LIMIT
            ) {
                break;
            }


            const setBrief = findSet(
                setList,
                requestedName
            );


            if (!setBrief) {

                failedSets.push(
                    `${requestedName} — set not found`
                );

                continue;

            }


            statusText.textContent =
                `Loading ${setBrief.name}...`;


            try {

                /*
                   STEP 3:
                   Download the full set.

                   A full set contains its cards.
                */

                const setData = await getJSON(
                    `${API_BASE}/sets/${encodeURIComponent(setBrief.id)}`
                );


                if (
                    !setData ||
                    !Array.isArray(setData.cards)
                ) {

                    failedSets.push(
                        `${setBrief.name} — no card list returned`
                    );

                    continue;

                }


                loadedSets.push(setBrief.name);


                /*
                   STEP 4:
                   Convert every API card into the simple format
                   used by this website.
                */

                for (const card of setData.cards) {

                    if (
                        CARD_LIMIT !== null &&
                        collected.length >= CARD_LIMIT
                    ) {
                        break;
                    }


                    /*
                       Cards without an image are skipped.
                    */

                    if (!card.image) {
                        continue;
                    }


                    const cardID = String(card.id);

                    const gender = getGender(cardID);


                    collected.push({

                        id: cardID,

                        name:
                            card.name ||
                            "Unknown Pokémon",

                        localId:
                            card.localId ||
                            "?",

                        setName:
                            setData.name ||
                            setBrief.name,

                        gender: gender,

                        imageLow:
                            getImageURL(
                                card.image,
                                "low"
                            ),

                        imageHigh:
                            getImageURL(
                                card.image,
                                "high"
                            )

                    });

                }

            }

            catch (setError) {

                console.error(
                    `Could not load ${requestedName}:`,
                    setError
                );

                failedSets.push(
                    `${requestedName} — could not load`
                );

            }

        }


        /*
           STEP 5:
           Sort cards.

           Sets remain grouped roughly by the order they loaded,
           while card numbers sort numerically where possible.
        */

        collected.sort((a, b) => {

            const setCompare =
                a.setName.localeCompare(b.setName);

            if (setCompare !== 0) {
                return setCompare;
            }


            const numberA =
                parseInt(a.localId, 10);

            const numberB =
                parseInt(b.localId, 10);


            if (
                !Number.isNaN(numberA) &&
                !Number.isNaN(numberB)
            ) {

                return numberA - numberB;

            }


            return String(a.localId)
                .localeCompare(
                    String(b.localId),
                    undefined,
                    { numeric: true }
                );

        });


        allCards = collected;


        /*
           STEP 6:
           Show results.
        */

        if (allCards.length === 0) {

            statusTitle.textContent =
                "No cards could be loaded.";

            statusText.textContent =
                "The website is working, but none of the selected sets returned usable cards.";

            if (failedSets.length > 0) {

                setStatus.textContent =
                    failedSets.join(" · ");

            }

            updateStats();

            return;

        }


        statusBox.style.display = "none";


        /*
           Log useful information to the browser console.
        */

        console.log(
            "Loaded sets:",
            loadedSets
        );

        console.log(
            "Failed sets:",
            failedSets
        );

        console.log(
            "Cards loaded:",
            allCards.length
        );


        renderCards();

        updateStats();


        /*
           If SOME sets failed, we do NOT destroy the page.
           The cards from successful sets remain visible.
        */

        if (failedSets.length > 0) {

            console.warn(
                "Some requested sets were not loaded:",
                failedSets
            );

        }

    }

    catch (error) {

        console.error(
            "Pokémon Gender Reveal loading error:",
            error
        );

        statusBox.style.display = "block";

        statusTitle.textContent =
            "The council could not be reached.";

        statusText.textContent =
            "The Pokémon database did not respond correctly. Try refreshing the page.";

        setStatus.textContent =
            error.message;

        allCards = [];

        updateStats();

    }

}


/* ============================================================
   GET FILTERED CARDS
   ============================================================ */

function getVisibleCards() {

    return allCards.filter(card => {

        /*
           Gender filter
        */

        if (
            currentFilter !== "all" &&
            card.gender !== currentFilter
        ) {

            return false;

        }


        /*
           Search
        */

        if (searchTerm) {

            const haystack = [
                card.name,
                card.localId,
                card.id,
                card.setName
            ]
            .join(" ")
            .toLowerCase();


            if (
                !haystack.includes(searchTerm)
            ) {

                return false;

            }

        }


        return true;

    });

}


/* ============================================================
   RENDER CARDS
   ============================================================ */

function renderCards() {

    const cards = getVisibleCards();

    grid.innerHTML = "";


    if (cards.length === 0) {

        emptyBox.style.display = "block";

        return;

    }


    emptyBox.style.display = "none";


    const fragment =
        document.createDocumentFragment();


    cards.forEach(card => {

        const element =
            document.createElement("article");

        element.className = "card";


        const genderSymbol =
            card.gender === "boy"
                ? "♂"
                : "♀";


        const genderWord =
            card.gender === "boy"
                ? "BOY"
                : "GIRL";


        element.innerHTML = `

            <div class="imageWrap">

                <img
                    src="${escapeHTML(card.imageLow)}"
                    alt="${escapeHTML(card.name)} Pokémon card"
                    loading="lazy"
                >

            </div>

            <div class="cardBody">

                <div class="pokemonName">
                    ${escapeHTML(card.name)}
                </div>

                <div class="cardInfo">

                    ${escapeHTML(card.setName)}
                    <br>

                    Card ${escapeHTML(card.localId)}
                    <br>

                    ID: ${escapeHTML(card.id)}

                </div>

                <div class="gender ${escapeHTML(card.gender)}">

                    ${genderSymbol}
                    ${genderWord}

                </div>

                <div class="spoken">
                    WE HAVE SPOKEN.
                </div>

            </div>
        `;


        element.addEventListener(
            "click",
            () => openModal(card)
        );


        fragment.appendChild(element);

    });


    grid.appendChild(fragment);

}


/* ============================================================
   UPDATE STATS
   ============================================================ */

function updateStats() {

    const boys =
        allCards.filter(
            card => card.gender === "boy"
        ).length;


    const girls =
        allCards.filter(
            card => card.gender === "girl"
        ).length;


    stats.textContent =
        `${allCards.length} rulings · ` +
        `${boys} boys · ` +
        `${girls} girls`;

}


/* ============================================================
   SEARCH
   ============================================================ */

searchInput.addEventListener(
    "input",
    event => {

        searchTerm =
            event.target.value
                .trim()
                .toLowerCase();

        renderCards();

    }
);


/* ============================================================
   FILTER BUTTONS
   ============================================================ */

filterButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            currentFilter =
                button.dataset.filter;


            filterButtons.forEach(
                otherButton => {

                    otherButton.classList.remove(
                        "active"
                    );

                }
            );


            button.classList.add(
                "active"
            );


            renderCards();

        }
    );

});


/* ============================================================
   RANDOM RULING
   ============================================================ */

randomButton.addEventListener(
    "click",
    () => {

        const available =
            getVisibleCards();


        if (available.length === 0) {
            return;
        }


        const randomIndex =
            Math.floor(
                Math.random() *
                available.length
            );


        openModal(
            available[randomIndex]
        );

    }
);


/* ============================================================
   OPEN MODAL
   ============================================================ */

function openModal(card) {

    modalImage.src =
        card.imageHigh ||
        card.imageLow;


    modalImage.alt =
        `${card.name} Pokémon card`;


    modalName.textContent =
        card.name;


    modalInfo.innerHTML = `

        ${escapeHTML(card.setName)}
        <br>

        Card ${escapeHTML(card.localId)}
        <br>

        <strong>
            Card ID:
        </strong>

        ${escapeHTML(card.id)}

    `;


    const isBoy =
        card.gender === "boy";


    modalGender.className =
        isBoy
            ? "boy"
            : "girl";


    modalGender.textContent =
        isBoy
            ? "♂ BOY"
            : "♀ GIRL";


    modalGender.style.background =
        isBoy
            ? "#dceaff"
            : "#ffe0ec";


    modalGender.style.color =
        isBoy
            ? "#1d5db7"
            : "#b62e68";


    modal.classList.add(
        "open"
    );


    document.body.style.overflow =
        "hidden";

}


/* ============================================================
   CLOSE MODAL
   ============================================================ */

function closeModal() {

    modal.classList.remove(
        "open"
    );


    document.body.style.overflow =
        "";

}


closeModalButton.addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    event => {

        if (event.target === modal) {

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            modal.classList.contains("open")
        ) {

            closeModal();

        }

    }
);


/* ============================================================
   START THE WEBSITE
   ============================================================ */

loadCards();

</script>

</body>
</html>
